stage: dev
fallbackFirst: "${opt:nope, ${Missing}, 'fb'} and ${Missing}"
fallbackSecond: "${Missing} and ${opt:nope, ${Missing}, 'fb'}"
twoFallbacks: "${opt:a, ${Missing}, 'x'} ${opt:b, ${Missing}, 'y'}"
cfnRefFallback: "https://${opt:nope, ${ApiGatewayRestApi}, 'api'}.com/${ApiGatewayRestApi}"
missingTwice: "${Missing} and ${Missing}"
missingSingle: "${opt:nope, ${Missing}, 'fb'}"
knownTwice: "${self:stage}-${opt:nope, ${self:stage}}"
knownThrice: "${self:stage}/${self:stage}/${opt:nope, ${self:stage}}"
awsPseudoFirst: "${opt:nope, ${AWS::Region}, 'us-east-1'} and ${AWS::Region}"
awsPseudoSecond: "${AWS::Region} and ${opt:nope, ${AWS::Region}, 'us-east-1'}"
unknownThenFallback: "${Missing} ${opt:b, ${self:nope}, 'z'}"
unknownThenBareFallback: "${opt:a, ${Missing}, 'x'} ${opt:b, y, 'y'}"
bareFallbackSingle: "${opt:b, y, 'y'}"
