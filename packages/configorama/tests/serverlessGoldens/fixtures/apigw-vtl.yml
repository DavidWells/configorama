# API Gateway mapping templates (Velocity): $vars, #set maps, #foreach, and JSON bodies are
# template text, not configorama syntax. Only ${self:...} refs inside are resolved.
service: proxy
provider:
  name: aws
  stage: ${opt:stage, 'dev'}
resources:
  Resources:
    GetUser:
      Type: AWS::ApiGateway::Method
      Properties:
        Integration:
          RequestTemplates:
            application/json: |
              #set($token = $input.params('Authorization').replace('Bearer ', ''))
              {
                "AccessToken": "$token"
              }
          IntegrationResponses:
            - StatusCode: '200'
              ResponseTemplates:
                application/json:
                  Fn::If:
                    - CustomMapping
                    - |
                      #set($inputRoot = $input.path('$'))
                      #set($mfaMap = {
                        "SMS_MFA": "SMS",
                        "SOFTWARE_TOKEN_MFA": "TOKEN"
                      })
                      #set($flags = { "stage": "${self:provider.stage}" })
                      {
                        "username": "$inputRoot.Username",
                        "attributes": {
                          #foreach($attr in $inputRoot.UserAttributes)
                            "$attr.Name": "$attr.Value"#if($foreach.hasNext),#end
                          #end
                        },
                        "mfaSetting": "$mfaMap.get($inputRoot.PreferredMfaSetting)",
                        "stage": "${self:provider.stage}"
                      }
                    - $input.json('$')
